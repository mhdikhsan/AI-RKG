# Core AI Risk KG construction pipeline - configuration.
# Every IRI the pipeline mints is built from base_iri. Change it and rerun `make all`.
base_iri: "http://example.org/airkg/"

# Namespace of the ontology terms (ak:). Not minted by the pipeline; read from the core module.
ak_namespace: "http://example.org/airkg#"

# Existing ontology modules (read-only for this pipeline).
ontology:
  core: ontology/airkg-core.ttl
  system: ontology/airkg-system.ttl
  core_iri: "http://example.org/airkg/core"
  system_iri: "http://example.org/airkg/system"
  # SHA-256 at baseline (2026-11-17); the checks fail if the files change.
  core_sha256: "214203027a407b24979d3c49529773be68e4dec030fbf38a22727ceb8d3d4e03"
  system_sha256: "fed3b1c5d1e5c3164ec82fc8cd3d18625b3d6925aa1bb99ab01d2e5af86f8c2f"

sources:
  nexus:
    repo: "https://github.com/IBM/ai-atlas-nexus.git"
    commit: "54fcc4e935150004dfec483d32387a58225e09ba"
    commit_date: "2026-11-16"
    data_dir: "src/ai_atlas_nexus/data"
    files:
      - knowledge_graph/risk_atlas_data.yaml
      - knowledge_graph/owasp_llm_2.0_data.yaml
      - knowledge_graph/mit_ai_risk_repository_data.yaml
      - knowledge_graph/mit_ai_risk_repository_data_controls.yaml
      - knowledge_graph/mit_ai_risk_mitigation_data.yaml
      - mappings/ibm2owasp.tsv
      - mappings/ibm2ibm.tsv
      - mappings/mit-ai-risk-repository_ibm-risk-atlas.tsv
      - mappings/mit_ai_risk_mitigation_mappings.tsv
    # IRI pattern of Nexus entries (used for skos:exactMatch; does not dereference yet)
    entry_iri: "https://w3id.org/ai-atlas-nexus/{nexus_id}"
  dpv:
    repo: "https://github.com/w3c/dpv.git"
    commit: "c85ffacc97041b90a7a3afb3b6417f0b4d9fafbc"   # HEAD on 2026-11-17 (commit date 2026-08-06)
    version: "2.3"         # release folder used; only to check that linked DPV IRIs exist
  beam:
    url: "https://semsys.ai.wu.ac.at/beam/beam_core.ttl"
    manual_file: sources/manual/beam_core.ttl
  iso22989:
    manual_file: sources/manual/iso22989_roles.csv
    # ak:source for ISO roles: the standard's URL; the clause goes to ak:identifier
    standard_url: "https://www.iso.org/standard/74296.html"

# Catalogues in scope (key = short code used in file names)
catalogues:
  ibm:
    nexus_file: knowledge_graph/risk_atlas_data.yaml
    taxonomy_id: ibm-risk-atlas
    title: "IBM AI Risk Atlas"
    source_url: "https://www.ibm.com/docs/en/watsonx/saas?topic=ai-risk-atlas"
    license: "https://www.apache.org/licenses/LICENSE-2.0"
    license_name: "Apache-2.0"
    rights_holder: "IBM Corporation"
    attribution: "IBM AI Risk Atlas, via IBM AI Atlas Nexus (Apache-2.0)."
  owasp:
    nexus_file: knowledge_graph/owasp_llm_2.0_data.yaml
    taxonomy_id: owasp-llm-2.0
    title: "OWASP Top 10 for LLM Applications 2025"
    source_url: "https://genai.owasp.org/llm-top-10/"
    license: "https://creativecommons.org/licenses/by-sa/4.0/"
    license_name: "CC BY-SA 4.0"
    rights_holder: "OWASP Foundation"
    attribution: "OWASP Top 10 for LLM Applications 2025, OWASP Foundation (CC BY-SA 4.0)."
  mit:
    nexus_file: knowledge_graph/mit_ai_risk_repository_data.yaml
    taxonomy_id: mit-ai-risk-repository
    title: "MIT AI Risk Repository (Domain Taxonomy)"
    source_url: "https://airisk.mit.edu/"
    license: "https://creativecommons.org/licenses/by/4.0/"
    license_name: "CC BY 4.0"
    rights_holder: "MIT AI Risk Repository authors (Slattery et al.)"
    attribution: "MIT AI Risk Repository, Slattery et al. (CC BY 4.0)."

# Licence of the MIT mitigation controls / taxonomy (same repository as the MIT risks)
mit_mitigations:
  controls_file: knowledge_graph/mit_ai_risk_repository_data_controls.yaml
  groups_file: knowledge_graph/mit_ai_risk_mitigation_data.yaml
  categorisation_file: mappings/mit_ai_risk_mitigation_mappings.tsv
  source_url: "https://airisk.mit.edu/"
  license: "https://creativecommons.org/licenses/by/4.0/"
  # Deterministic typing rule: this top category -> ak:TechnicalMitigation, others -> ak:OrganisationalMitigation
  technical_category_name: "Technical & Security Controls"

# The 33 "Risk" entries of the MIT file are 24 domain-taxonomy subdomains + 9 causal-taxonomy
# facets (isDefinedByTaxonomy: mit-ai-risk-repository-causal). Facets are not risks;
# set true to import them anyway.
mit_include_causal_facets: false

crosswalks:
  - file: mappings/ibm2owasp.tsv
  - file: mappings/ibm2ibm.tsv
  - file: mappings/mit-ai-risk-repository_ibm-risk-atlas.tsv
# SSSOM rows with predicate_modifier "Not" state that the mapping does NOT hold; never import them.
crosswalk_drop_negated: true
crosswalk_license: "https://www.apache.org/licenses/LICENSE-2.0"

# Copying of description texts per catalogue (licences differ)
copy_descriptions:
  ibm: true
  mit: true
  owasp: false

# Reused-role IRIs: {base_iri}role/{scheme}/{id}
roles:
  # BEAM process classes -> ak:ComponentRole individuals {base_iri}role/beam/{id}
  # core = generate/transform/infer; train/engineer specialise generate
  beam:
    - {id: generate,  name: "Generate step",  beam_class: Generate,  parent: ""}
    - {id: transform, name: "Transform step", beam_class: Transform, parent: ""}
    - {id: infer,     name: "Infer step",     beam_class: Infer,     parent: ""}
    - {id: train,     name: "Train step",     beam_class: Train,     parent: generate}
    - {id: engineer,  name: "Engineer step",  beam_class: Engineer,  parent: generate}
  beam_namespace: "http://w3id.org/beam/core#"
  # Hand-written grounding of authored roles to external vocabularies. Filled by hand;
  # validated and mapped by scripts/roles.py -> build/role_grounding.nt (core module unchanged).
  grounding_file: sources/manual/role_grounding.csv
  grounding_predicates: [seeAlso, exactMatch, closeMatch, broadMatch, narrowMatch, relatedMatch]
  # CURIE prefixes accepted in the 'target' column; vocabularies with a local file are checked for existence.
  grounding_prefixes:
    beam: "http://w3id.org/beam/core#"
    dpv:  "https://w3id.org/dpv#"
    ai:   "https://w3id.org/dpv/ai#"
    airo: "https://w3id.org/airo#"
    ak:   "http://example.org/airkg#"

# Where IBM Risk Atlas says a risk arises (risk_type) -> authored roles a pattern for it would
# likely involve. Editable HINTS, used only in build/reports/pattern_coverage.md (nothing is asserted).
risk_type_hints:
  training-data: {roles: [TrainingDataRole, TrainStepRole], note: "risk arises in the data used to produce a model"}
  inference:     {roles: [InferStepRole, InputDataRole], note: "risk arises when a model is applied to input"}
  output:        {roles: [OutputDataRole, GeneratedOutputRole], note: "risk arises in or through the output"}
  agentic:       {roles: [OperatorRole], note: "risk arises from an AI agent acting; consider ak:AutonomyLevel context"}
  non-technical: {roles: [], stakeholder_roles: true, note: "governance/societal risk; patterns mainly involve stakeholder roles"}

# Morph-KGC
mapping_engine: morph-kgc
