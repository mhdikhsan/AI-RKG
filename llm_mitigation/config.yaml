# llm-mitigation configuration. Paths are relative to this file's folder.

provider: anthropic            # anthropic | fake (fake = deterministic, for tests / dry checks)
model: claude-sonnet-5-5       # or claude-haiku-5-5 for a cheaper run (see README)
effort: medium                 # output_config.effort: low | medium | high | xhigh | max
# Sampling: temperature 0 is not possible: claude-sonnet-5-5 and claude-haiku-5-5 reject
# any non-default temperature with HTTP 400. It is therefore NOT sent. Reruns are reproducible
# through the response cache instead (README, "Reproducibility").
temperature: null
max_tokens: 16000              # covers adaptive thinking + the short JSON answer
# Server-side refusal fallback (only for models that support it, e.g. claude-sonnet-5-5).
# If a fallback model answers, its id is recorded in model_version on every row.
server_side_fallback: true
retries_on_invalid: 1          # retry once on invalid JSON / schema violation, then log and skip

scope:
  catalogues: [ibm, mit, owasp]   # risks in scope (from staging/risks.csv)

shortlist:
  k: 20                          # controls offered to the LLM per risk
  # Text of a control used for TF-IDF. "description" is included to raise recall; set to
  # [name, group] to use names only.
  control_fields: [name, group, description]

answer:
  max_links_per_risk: 5
  rationale_max_chars: 400

paths:
  risks: ../staging/risks.csv
  controls: ../staging/mit_controls.csv
  groups: ../staging/mit_control_groups.csv
  prompt: prompts/link_mitigations.md
  schema: schema/response.schema.json
  output_dir: output
  cache_dir: cache
  accepted_out: ../staging/accepted_mitigation_links.csv

# Prices in USD per million tokens (Anthropic first-party API). Checked 2026-11-17 against
# Anthropic's model table (cached 2026-11-03); verify at https://platform.claude.com/docs/en/about-claude/pricing
pricing:
  claude-sonnet-5-5: {input: 2.00, output: 10.00}
  claude-haiku-5-5:  {input: 0.10, output: 0.50}   # prompts up to 100K tokens

# Assumptions used by `estimate` (no API call). Thinking tokens are billed as output tokens.
estimate:
  chars_per_token: 3.5
  answer_tokens_per_call: 350
  thinking_tokens_per_call: {low: 300, medium: 1200, high: 3000, xhigh: 6000, max: 10000}
